name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest
    container: debian:12
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake ninja-build g++ \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-multimedia-dev \
            libarchive-dev libpoppler-qt6-dev pkg-config qt6-wayland \
            dpkg-dev file patchelf desktop-file-utils appstream lintian

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.1"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DFINDER_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate desktop entry
        run: desktop-file-validate build/org.finderlinux.Finder.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net data/org.finderlinux.Finder.metainfo.xml

      - name: Build Debian package
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb > /dev/null
          lintian dist/*.deb || true
          # recommend-only tools must be declared; a package that installs and
          # then silently lacks Trash/media/ACL support is worse than one that
          # pulls them in.
          dpkg-deb -f dist/*.deb Recommends | grep -q udisks2
          # the shared FileManager1 D-Bus name must never be shipped, or the
          # package cannot coexist with nautilus/dolphin/elementary-files.
          if dpkg-deb -c dist/*.deb | grep -q "dbus-1/services/org.freedesktop.FileManager1.service"; then
            echo "ERROR: package ships the shared FileManager1 service name" >&2
            exit 1
          fi

      - name: Build AppImage
        shell: bash
        run: |
          bash packaging/make-appimage.sh "${{ steps.version.outputs.version }}"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            "dist/finder-linux-${{ steps.version.outputs.version }}-x86_64.AppImage" --version
          tmpdir="$(mktemp -d)"
          (cd "$tmpdir" && APPIMAGE_EXTRACT_AND_RUN=1 \
            "$GITHUB_WORKSPACE/dist/finder-linux-${{ steps.version.outputs.version }}-x86_64.AppImage" \
            --appimage-extract >/dev/null)
          test -f "$tmpdir/squashfs-root/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"
          rm -rf "$tmpdir"

      - name: Build tarball
        shell: bash
        run: |
          bash packaging/make-tarball.sh "${{ steps.version.outputs.version }}"
          tar -tzf "dist/finder-linux-${{ steps.version.outputs.version }}-x86_64.tar.gz" > /dev/null

      - name: Checksums
        shell: bash
        run: |
          cd dist
          # .rpm is built by the separate Fedora job and added at publish time,
          # so the checksum file is generated there over the final file set.
          sha256sum *.deb *.AppImage *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: finder-linux-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # RPM must be produced on a Fedora-family host: rpmbuild and the dependency
  # solver are not available in the Debian packaging image, and an RPM built
  # against Debian's Qt would carry Debian sonames Fedora cannot satisfy.
  rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:41
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            ca-certificates git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            rpm-build qt6-qtbase-devel qt6-qtsvg-devel qt6-qtmultimedia-devel \
            libarchive-devel poppler-qt6-devel

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DFINDER_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build RPM
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G RPM -B dist
          rpm -qip dist/*.rpm
          rpm -qpR dist/*.rpm | sort
          # the same shared-name rule applies to RPM payloads
          if rpm -qpl dist/*.rpm | grep -qx "/usr/share/dbus-1/services/org.freedesktop.FileManager1.service"; then
            echo "ERROR: RPM ships the shared FileManager1 service name" >&2
            exit 1
          fi

      - name: Verify the RPM installs and runs
        shell: bash
        run: |
          rpm -i --nodeps dist/*.rpm
          installed="$(rpm -q finder-linux)"
          echo "installed: $installed"
          QT_QPA_PLATFORM=offscreen /usr/bin/finder-linux --version

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: finder-linux-${{ steps.version.outputs.version }}-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: finder-linux-${{ steps.version.outputs.version }}
          path: dist

      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: finder-linux-${{ steps.version.outputs.version }}-rpm
          path: dist

      - name: Regenerate checksums over all assets
        shell: bash
        run: |
          cd dist
          # The build job could not see the RPM, so recompute over the final set.
          rm -f SHA256SUMS
          sha256sum *.deb *.rpm *.AppImage *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: File Manager ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
